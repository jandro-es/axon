<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AXON dashboard</title>
    <script>
      // Resolve the theme before first paint: a stored choice wins, otherwise
      // the system decides. Without this a dark-mode reload flashes white.
      // Mirrors the resolution in src/theme.jsx — same key, same values.
      (function () {
        try {
          var m = localStorage.getItem('axon.theme')
          var dark = m === 'dark' || ((m === 'system' || !m) && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) { /* private mode: keep the markup default */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
